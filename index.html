<!DOCTYPE html>
<html lang="ja">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>DARKWEB PROTOCOL // CYBER BOOKKEEPING</title>
 <style>
 * { box-sizing: border-box; }

 /* ==================================================
  ★ ダークウェブ＆サイバー テーマカラー設定エリア
 ================================================== */
 :root {
 --primary: #00ff66;         /* ターミナルグリーン（実行・承認・メイン） */
 --primary-hover: #00cc52;   /* ホバー時ネオングリーン */
 --bg-body: #05080d;         /* ディープダークウェブ背景 */
 --card-bg: #0d131a;         /* ターミナルコンソールカード */
 --text-main: #e2e8f0;       /* メインシステムテキスト */
 --text-muted: #64748b;      /* ログ・サブテキスト */
 --border: #1e293b;          /* サーキットボード境界線 */
 --debit-border: #38bdf8;    /* 借方：シアン／データインフロー */
 --credit-border: #f43f5e;   /* 貸方：クリムゾン／データアウトフロー */
 --correct-bg: #064e3b;      /* 侵入成功（暗緑） */
 --correct-text: #6ee7b7;    /* 侵入成功テキスト（明緑） */
 --wrong-bg: #4c0519;        /* 検知アラート（暗赤） */
 --wrong-text: #fda4af;      /* 検知アラートテキスト（明赤） */
 }

 body {
 margin: 0;
 min-height: 100vh;
 font-family: "SF Mono", "Fira Code", "Courier New", Consolas, -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
 color: var(--text-main);
 background-color: var(--bg-body);
 background-image: radial-gradient(rgba(0, 255, 102, 0.05) 1px, transparent 0);
 background-size: 24px 24px;
 padding: 16px;
 overflow-x: hidden;
 }
 .container {
 width: 100%;
 max-width: 720px;
 margin: 0 auto;
 background: var(--card-bg);
 border: 1.5px solid var(--border);
 border-radius: 12px;
 padding: 22px;
 box-shadow: 0 0 25px rgba(0, 255, 102, 0.08), 0 8px 30px rgba(0, 0, 0, 0.7);
 position: relative;
 }
 .header {
 display: flex;
 justify-content: space-between;
 align-items: center;
 padding-bottom: 14px;
 border-bottom: 1px solid var(--border);
 margin-bottom: 16px;
 }
 .logo-area { display: flex; align-items: center; gap: 12px; }
 .logo-icon { font-size: 2rem; line-height: 1; filter: drop-shadow(0 0 6px rgba(0,255,102,0.4)); }
 .logo-title { margin: 0; font-size: 1.15rem; color: var(--primary); font-weight: 800; letter-spacing: 0.06em; }
 .status-badge {
 background: rgba(0, 255, 102, 0.15);
 border: 1px solid var(--primary);
 color: var(--primary);
 padding: 4px 12px;
 border-radius: 4px;
 font-size: 0.75rem;
 font-weight: bold;
 text-transform: uppercase;
 letter-spacing: 0.05em;
 }
 .status-badge.review { background: rgba(245, 158, 11, 0.15); border-color: #f59e0b; color: #f59e0b; }

 .stage-tabs {
 display: grid;
 grid-template-columns: repeat(5, 1fr);
 gap: 6px;
 margin-bottom: 16px;
 }
 @media (max-width: 480px) {
 .stage-tabs { grid-template-columns: repeat(3, 1fr); }
 }
 .stage-btn {
 padding: 10px 4px;
 border: 1px solid var(--border);
 border-radius: 6px;
 background: #111827;
 font-size: 0.72rem;
 font-weight: bold;
 color: var(--text-muted);
 cursor: pointer;
 text-align: center;
 line-height: 1.2;
 transition: all 0.2s ease;
 font-family: inherit;
 }
 .stage-btn.active {
 background: rgba(0, 255, 102, 0.12);
 color: var(--primary);
 border-color: var(--primary);
 box-shadow: 0 0 10px rgba(0, 255, 102, 0.25);
 }

 .quest-progress {
 margin-bottom: 16px;
 padding: 10px 14px;
 background: #111827;
 border-radius: 6px;
 border: 1px solid #1e293b;
 }
 .progress-track {
 height: 6px;
 width: 100%;
 background: #1e293b;
 border-radius: 999px;
 overflow: hidden;
 margin-top: 6px;
 }
 .progress-fill {
 width: 0%;
 height: 100%;
 background: var(--primary);
 box-shadow: 0 0 8px var(--primary);
 transition: width 0.3s ease;
 }

 .card {
 background: #111827;
 border: 1px solid var(--border);
 border-left: 4px solid var(--primary);
 border-radius: 8px;
 padding: 16px;
 margin-bottom: 16px;
 box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
 }
 .question-label {
 display: inline-block;
 background: rgba(0, 255, 102, 0.15);
 border: 1px solid var(--primary);
 color: var(--primary);
 padding: 2px 8px;
 border-radius: 4px;
 font-size: 0.72rem;
 font-weight: bold;
 margin-bottom: 10px;
 letter-spacing: 0.05em;
 }
 .story-text { margin: 0; font-size: 0.95rem; line-height: 1.7; color: #f1f5f9; }

 .split-container {
 display: grid;
 grid-template-columns: 1fr 1fr;
 gap: 12px;
 margin-bottom: 16px;
 }
 @media(max-width: 560px) { .split-container { grid-template-columns: 1fr; } }
 .side-column {
 padding: 12px;
 background: #111827;
 border: 1.5px solid var(--debit-border);
 border-radius: 8px;
 }
 .side-column.credit { border-color: var(--credit-border); }
 .side-title {
 text-align: center;
 margin-bottom: 10px;
 font-weight: bold;
 font-size: 0.85rem;
 letter-spacing: 0.05em;
 color: var(--debit-border);
 }
 .side-column.credit .side-title { color: var(--credit-border); }
 .entry-row { display: flex; gap: 6px; margin-bottom: 8px; }
 .entry-row input {
 padding: 8px;
 border: 1px solid var(--border);
 border-radius: 4px;
 font-size: 0.88rem;
 background: #0b0f17;
 color: #ffffff;
 font-family: inherit;
 width: 100%;
 }
 .entry-row input[type="text"] { flex: 1.3; }
 .entry-row input[type="number"] { flex: 1; }
 .entry-row input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 6px rgba(0,255,102,0.3); }
 .btn-remove {
 background: rgba(244, 63, 94, 0.15);
 border: 1px solid var(--credit-border);
 border-radius: 4px;
 color: #fda4af;
 cursor: pointer;
 font-weight: bold;
 }
 .btn-add {
 width: 100%;
 padding: 7px;
 background: #0b0f17;
 border: 1px dashed var(--border);
 color: var(--text-muted);
 border-radius: 4px;
 font-size: 0.8rem;
 cursor: pointer;
 font-weight: bold;
 font-family: inherit;
 transition: all 0.15s;
 }
 .btn-add:hover { border-color: var(--primary); color: var(--primary); }
 
 .btn-submit {
 width: 100%;
 padding: 14px;
 background: var(--primary);
 color: #05080d;
 border: none;
 border-radius: 6px;
 font-size: 1.05rem;
 font-weight: 800;
 letter-spacing: 0.08em;
 cursor: pointer;
 box-shadow: 0 0 15px rgba(0, 255, 102, 0.35);
 transition: all 0.2s ease;
 font-family: inherit;
 }
 .btn-submit:hover { background: var(--primary-hover); box-shadow: 0 0 20px rgba(0, 255, 102, 0.5); }

 .result-box {
 display: none;
 margin-top: 14px;
 padding: 14px;
 border-radius: 6px;
 font-size: 0.9rem;
 line-height: 1.65;
 }
 .result-box.correct {
 background: var(--correct-bg);
 border: 1px solid #10b981;
 color: var(--correct-text);
 box-shadow: 0 0 10px rgba(16, 185, 129, 0.2);
 }
 .result-box.wrong {
 background: var(--wrong-bg);
 border: 1px solid #f43f5e;
 color: var(--wrong-text);
 box-shadow: 0 0 10px rgba(244, 63, 94, 0.2);
 }
 
 .nav-buttons { display: flex; gap: 10px; margin-top: 14px; }
 .nav-btn {
 flex: 1;
 padding: 10px;
 background: #1e293b;
 color: #e2e8f0;
 border: 1px solid var(--border);
 border-radius: 6px;
 font-weight: bold;
 cursor: pointer;
 font-family: inherit;
 transition: background 0.15s;
 }
 .nav-btn:hover { background: #334155; }
 
 .clear-card { display: none; text-align: center; padding: 28px 16px; }
 .btn-review, .btn-restart {
 width: 100%;
 padding: 12px;
 border: none;
 border-radius: 6px;
 font-weight: bold;
 cursor: pointer;
 margin-bottom: 8px;
 font-family: inherit;
 }
 .btn-review { background: #f59e0b; color: #000; font-weight: 800; }
 .btn-restart { background: #334155; color: white; }

 details {
 margin-top: 24px;
 border-top: 1px dashed var(--border);
 padding-top: 14px;
 }
 summary { cursor: pointer; font-size: 0.8rem; color: var(--text-muted); font-weight: bold; }
 textarea {
 width: 100%;
 height: 90px;
 margin-top: 10px;
 padding: 10px;
 border: 1px solid var(--border);
 border-radius: 6px;
 background: #0b0f17;
 color: var(--primary);
 font-family: monospace;
 font-size: 0.8rem;
 }
 .load-btn {
 width: 100%;
 margin-top: 8px;
 padding: 10px;
 background: #1e293b;
 border: 1px solid var(--primary);
 color: var(--primary);
 border-radius: 6px;
 font-weight: bold;
 cursor: pointer;
 font-family: inherit;
 }
 .load-btn:hover { background: rgba(0, 255, 102, 0.15); }
 .reset-link {
 display: block;
 margin-top: 18px;
 text-align: center;
 font-size: 0.75rem;
 color: var(--text-muted);
 cursor: pointer;
 text-decoration: underline;
 }

 .shake-animation {
 animation: dmgShake 0.45s cubic-bezier(.36,.07,.19,.97) both;
 }
 @keyframes dmgShake {
 10%, 90% { transform: translate3d(-4px, 0, 0); }
 20%, 80% { transform: translate3d(6px, 0, 0); }
 30%, 50%, 70% { transform: translate3d(-8px, 0, 0); }
 40%, 60% { transform: translate3d(8px, 0, 0); }
 }

 .rising-item {
 position: fixed;
 bottom: -30px;
 z-index: 9999;
 pointer-events: none;
 user-select: none;
 opacity: 0;
 animation: riseMagic ease-out forwards;
 }
 @keyframes riseMagic {
 0% { transform: translateY(0) scale(0.4) rotate(0deg); opacity: 0; }
 15% { opacity: 0.95; }
 50% { transform: translateY(-50vh) translateX(var(--drift, 20px)) scale(1.1) rotate(180deg); opacity: 0.9; }
 85% { opacity: 0.7; }
 100% { transform: translateY(-110vh) translateX(calc(var(--drift, 20px) * -1)) scale(1.3) rotate(360deg); opacity: 0; }
 }
 </style>
</head>
<body>

<div class="container" id="mainContainer">
 <div class="header">
 <div class="logo-area">
 <div class="logo-icon" id="app-logo">👾</div>
 <div>
 <h1 class="logo-title" id="app-title">DARKWEB PROTOCOL // BOOKKEEPING</h1>
 <div style="font-size:0.7rem; color:var(--text-muted);" id="sub-title">〜 ホワイトハッカーから闇の支配者への軌跡 〜</div>
 </div>
 </div>
 <span class="status-badge" id="status-tag">SECURE SESSION</span>
 </div>

 <div class="stage-tabs">
 <button type="button" class="stage-btn active" id="tab-0" onclick="switchStage(0)">LEVEL 1<br>白の防壁</button>
 <button type="button" class="stage-btn" id="tab-1" onclick="switchStage(1)">LEVEL 2<br>境界線侵入</button>
 <button type="button" class="stage-btn" id="tab-2" onclick="switchStage(2)">LEVEL 3<br>闇市プロトコル</button>
 <button type="button" class="stage-btn" id="tab-3" onclick="switchStage(3)">LEVEL 4<br>組織シンジケート</button>
 <button type="button" class="stage-btn" id="tab-4" onclick="switchStage(4)">LEVEL 5<br>深層の玉座</button>
 </div>

 <div class="quest-progress">
 <div style="display:flex; justify-content:space-between; font-size:0.75rem; font-weight:bold;">
 <span id="stage-badge-text" style="color:var(--primary);">LEVEL 1</span>
 <span id="progress-text">PACKET // 1</span>
 </div>
 <div class="progress-track">
 <div class="progress-fill" id="progress-fill"></div>
 </div>
 </div>

 <div id="quiz-area">
 <div class="card">
 <div class="question-label" id="q-number">LOG // 01</div>
 <p class="story-text" id="story-display">Connecting to terminal...</p>
 </div>

 <div class="split-container">
 <div class="side-column">
 <div class="side-title">借方 [DEBIT // INFLOW]</div>
 <div id="debit-rows"></div>
 <button type="button" class="btn-add" onclick="addRow('debit')">＋ パラメータ追加</button>
 </div>
 <div class="side-column credit">
 <div class="side-title">貸方 [CREDIT // OUTFLOW]</div>
 <div id="credit-rows"></div>
 <button type="button" class="btn-add" onclick="addRow('credit')">＋ パラメータ追加</button>
 </div>
 </div>

 <button type="button" class="btn-submit" id="submit-btn" onclick="checkAnswer()">EXECUTE // ハッキングを実行する</button>
 <div id="result-display" class="result-box"></div>

 <div class="nav-buttons">
 <button type="button" class="nav-btn" onclick="prevQuestion()">◀ PREV LOG</button>
 <button type="button" class="nav-btn" id="next-btn" onclick="nextQuestion()">NEXT LOG ▶</button>
 </div>
 </div>

 <div id="clear-area" class="clear-card">
 <h2 id="clear-heading" style="color:var(--primary); font-size:1.5rem; margin-top:0;">ROOT ACCESS GRANTED</h2>
 <div id="complete-badge-area"></div>
 <p id="score-text" style="line-height:1.6; color:#94a3b8;"></p>
 <div id="review-btn-area"></div>
 <button type="button" class="btn-restart" onclick="startFreshStage()">システムを再起動して再試行</button>
 </div>

 <details>
 <summary>📥 クラスター設定をインポート (JSON)</summary>
 <textarea id="json-input" placeholder="作成したJSON配列をここに貼り付けると、現在の階層データを上書き展開できます"></textarea>
 <button type="button" class="load-btn" onclick="loadCustomData()">パッチを適用</button>
 </details>

 <span class="reset-link" onclick="forceReset()">※ プロトコルを初期化（ファクトリーリセット）</span>
</div>
<script>
// ==================================================
// ★ 演出絵文字設定エリア（サイバー・ダークウェブ仕様）
// ==================================================
const RISING_EFFECT_SYMBOLS = ["💻", "⚡", "🔓", "💀", "💰", "🌐", "🪙", "🕶️"];

// ==================================================
// 内蔵初期問題データ（全5レベル × 10問 ＝ 計50問）
// ==================================================
const STAGES = [
 {
 title: "LEVEL 1：白の防壁（セキュリティ会社の新米アナリスト時代）",
 questions: [
 {
 "story": "新米アナリストとして防衛部門に配属された。解析業務用のセキュリティツール 100,000円を仕入れ、代金は会社の現金で支払った。（仕入）（現金）",
 "debit": [{ "account": "仕入", "amount": 100000 }],
 "credit": [{ "account": "現金", "amount": 100000 }],
 "explanation": "費用（Expense）である「仕入」を借方に計上し、資産（Asset）である「現金」の減少を貸方に記入します。"
 },
 {
 "story": "顧客企業にウイルススキャナ製品 200,000円を納品・売上計上し、代金は来月末払いの掛けとした。（売掛金）（売上）",
 "debit": [{ "account": "売掛金", "amount": 200000 }],
 "credit": [{ "account": "売上", "amount": 200000 }],
 "explanation": "資産（Asset）である債権「売掛金」を借方に計上し、収益（Revenue）である「売上」を貸方に記入します。"
 },
 {
 "story": "先月顧客に納品したセキュリティ製品の売掛金 200,000円が、会社の普通預金口座に入金された。（普通預金）（売掛金）",
 "debit": [{ "account": "普通預金", "amount": 200000 }],
 "credit": [{ "account": "売掛金", "amount": 200000 }],
 "explanation": "資産（Asset）である「普通預金」の増加を借方に、回収した債権「売掛金」の消滅を貸方に記入します。"
 },
 {
 "story": "社内ネットワーク監視用の専用サーバー 350,000円を購入し、代金は小切手を振り出して当座預金から支払った。（備品）（当座預金）",
 "debit": [{ "account": "備品", "amount": 350000 }],
 "credit": [{ "account": "当座預金", "amount": 350000 }],
 "explanation": "固定資産「備品」の借方計上と、小切手振出による資産「当座預金」の減少を貸方に記入します。"
 },
 {
 "story": "新人の研修用サイバーセキュリティ専門書 30,000円を現金で購入した。（新聞図書費）（現金）",
 "debit": [{ "account": "新聞図書費", "amount": 30000 }],
 "credit": [{ "account": "現金", "amount": 30000 }],
 "explanation": "費用の発生である「新聞図書費」を借方に、資産の減少である「現金」を貸方に記入します。"
 },
 {
 "story": "ラボの光熱費 25,000円およびデータセンター通信費 40,000円が、普通預金口座から引き落とされた。（水道光熱費）（通信費）（普通預金）",
 "debit": [{ "account": "水道光熱費", "amount": 25000 }, { "account": "通信費", "amount": 40000 }],
 "credit": [{ "account": "普通預金", "amount": 65000 }],
 "explanation": "費用の発生「水道光熱費」「通信費」を借方にまとめ、資産の減少「普通預金」を貸方に記入します。"
 },
 {
 "story": "顧客から緊急インシデント対応の相談を受け、着手金として手付金 50,000円を普通預金で受け取った。（普通預金）（前受金）",
 "debit": [{ "account": "普通預金", "amount": 50000 }],
 "credit": [{ "account": "前受金", "amount": 50000 }],
 "explanation": "役務提供前に受け取った金銭は負債（Liability）である「前受金」として貸方に計上します。"
 },
 {
 "story": "インシデント解析の出張調査を命じられ、交通費概算額として 20,000円を現金で仮払いされた。（仮払金）（現金）",
 "debit": [{ "account": "仮払金", "amount": 20000 }],
 "credit": [{ "account": "現金", "amount": 20000 }],
 "explanation": "用途や金額が未確定の支出は資産（Asset）である「仮払金」を借方に計上します。"
 },
 {
 "story": "出張から帰還。実際の交通費は 18,000円（旅費交通費）であり、残額 2,000円を現金で精算返納した。（旅費交通費）（現金）（仮払金）",
 "debit": [{ "account": "旅費交通費", "amount": 18000 }, { "account": "現金", "amount": 2000 }],
 "credit": [{ "account": "仮払金", "amount": 20000 }],
 "explanation": "確定した「旅費交通費」と返納された「現金」を借方に記入し、「仮払金」を貸方で全額相殺します。"
 },
 {
 "story": "オフィスの金庫をチェックすると、帳簿上の現金残高より 5,000円不足していることが判明した。原因は現時点で不明。（現金過不足）（現金）",
 "debit": [{ "account": "現金過不足", "amount": 5000 }],
 "credit": [{ "account": "現金", "amount": 5000 }],
 "explanation": "実際の現金残高に合わせるため、「現金」を減額（貸方）し、「現金過不足」を借方に計上します。"
 }
 ]
 },
 {
 title: "LEVEL 2：境界線侵入（グレーハッカーへの傾倒と独自活動）",
 questions: [
 {
 "story": "社内の規定を破り、闇ルートで高度なパケット解析ソフト 250,000円を掛けで仕入れた。（仕入）（買掛金）",
 "debit": [{ "account": "仕入", "amount": 250000 }],
 "credit": [{ "account": "買掛金", "amount": 250000 }],
 "explanation": "仕入債務である負債（Liability）の「買掛金」を貸方に、費用「仕入」を借方に記入します。"
 },
 {
 "story": "以前掛けで仕入れていた暗号化ツール代金 250,000円を、普通預金から振り込んで決済した。（買掛金）（普通預金）",
 "debit": [{ "account": "買掛金", "amount": 250000 }],
 "credit": [{ "account": "普通預金", "amount": 250000 }],
 "explanation": "負債の消滅として「買掛金」を借方に記入し、資産の減少「普通預金」を貸方に記入します。"
 },
 {
 "story": "秘密の作業拠点とするワンルームの家賃 80,000円を普通預金から支払った。（支払家賃）（普通預金）",
 "debit": [{ "account": "支払家賃", "amount": 80000 }],
 "credit": [{ "account": "普通預金", "amount": 80000 }],
 "explanation": "費用（Expense）である「支払家賃」を借方に計上し、「普通預金」を貸方に記入します。"
 },
 {
 "story": "裏の脆弱性調査ツール 150,000円を購入するため、内金 30,000円を手付金として普通預金から振り込んだ。（前払金）（普通預金）",
 "debit": [{ "account": "前払金", "amount": 30000 }],
 "credit": [{ "account": "普通預金", "amount": 30000 }],
 "explanation": "商品や役務の受け取り前に支払った内金は資産（Asset）の「前払金」として借方に計上します。"
 },
 {
 "story": "先ほどの調査ツール 150,000円が納品された。前払金 30,000円を充当し、残額は掛けとした。（仕入）（前払金）（買掛金）",

// アプリ共通ロジック
// ==================================================
let currentStageIndex = 0;
let currentQuestions = [];
let currentIndex = 0;
let correctCount = 0;
let wrongList = [];
let answeredSet = new Set();
let isReviewMode = false;

function init() {
 const savedStage = localStorage.getItem("boki_cyber_current_stage");
 currentStageIndex = savedStage ? parseInt(savedStage, 10) : 0;
 if (currentStageIndex < 0 || currentStageIndex >= STAGES.length) currentStageIndex = 0;
 loadStage(currentStageIndex);
}

function switchStage(stageIdx) {
 if (stageIdx === currentStageIndex && !isReviewMode) return;
 loadStage(stageIdx);
}

function loadStage(stageIdx) {
 currentStageIndex = stageIdx;
 localStorage.setItem("boki_cyber_current_stage", currentStageIndex);

 for (let i = 0; i < STAGES.length; i++) {
 const btn = document.getElementById(`tab-${i}`);
 if (btn) {
 if (i === stageIdx) btn.classList.add("active");
 else btn.classList.remove("active");
 }
 }

 const stageObj = STAGES[stageIdx];
 document.getElementById("stage-badge-text").textContent = `LEVEL ${stageIdx + 1}`;
 document.getElementById("sub-title").textContent = `〜 ${stageObj.title} 〜`;

 const keyPrefix = `boki_cyber_st${stageIdx}_`;
 let stageData = stageObj.questions;
 try {
 const customData = localStorage.getItem(`${keyPrefix}data`);
 if (customData) {
 const parsed = JSON.parse(customData);
 if (Array.isArray(parsed) && parsed.length > 0) stageData = parsed;
 }
 } catch(e) {}

 currentQuestions = [...stageData];
 currentIndex = 0;
 correctCount = 0;
 wrongList = [];
 isReviewMode = false;
 answeredSet.clear();

 document.getElementById("quiz-area").style.display = "block";
 document.getElementById("clear-area").style.display = "none";
 loadQuestion(0);
}

function createRowHTML(account = "", amount = "") {
 const div = document.createElement("div");
 div.className = "entry-row";
 div.innerHTML = `
 <input type="text" placeholder="勘定科目" value="${account}">
 <input type="number" placeholder="金額" value="${amount}">
 <button type="button" class="btn-remove" onclick="removeRow(this)">✕</button>
 `;
 return div;
}

function addRow(side) {
 const container = document.getElementById(`${side}-rows`);
 if (container) container.appendChild(createRowHTML());
}

function removeRow(btn) {
 const row = btn.closest(".entry-row");
 if (row && row.parentElement && row.parentElement.children.length > 1) {
 row.remove();
 } else {
 alert("⚠️ 最低1つのパラメータ（行）が必要です。");
 }
}

function loadQuestion(index) {
 if (!currentQuestions || currentQuestions.length === 0) return;
 if (index < 0 || index >= currentQuestions.length) index = 0;
 currentIndex = index;

 const tag = document.getElementById("status-tag");
 if (isReviewMode) {
 tag.textContent = "DEBUG / REVIEW";
 tag.className = "status-badge review";
 } else {
 tag.textContent = "ACTIVE EXPLOIT";
 tag.className = "status-badge";
 }

 const prefix = isReviewMode ? "DEBUG" : `LOG 0${currentStageIndex + 1}`;
 document.getElementById("q-number").textContent = `${prefix} // SEQUENCE ${index + 1} OF ${currentQuestions.length}`;
 document.getElementById("story-display").textContent = currentQuestions[index].story;

 document.getElementById("debit-rows").innerHTML = "";
 document.getElementById("credit-rows").innerHTML = "";
 addRow("debit");
 addRow("credit");

 const res = document.getElementById("result-display");
 res.style.display = "none";
 res.className = "result-box";
 document.getElementById("submit-btn").style.display = "block";

 const nextBtn = document.getElementById("next-btn");
 nextBtn.textContent = (currentIndex === currentQuestions.length - 1) ? "アクセス結果を確認" : "NEXT LOG ▶";

 const percent = Math.round(((index + 1) / currentQuestions.length) * 100);
 document.getElementById("progress-fill").style.width = percent + "%";
 document.getElementById("progress-text").textContent = `PACKET ${index + 1} / ${currentQuestions.length} (${percent}%)`;
}

function getEntries(side) {
 const container = document.getElementById(`${side}-rows`);
 if (!container) return [];
 const rows = container.children;
 const entries = [];
 for (let row of rows) {
 const inputs = row.querySelectorAll("input");
 if (inputs.length >= 2) {
 const account = inputs[0].value.trim();
 const amount = parseInt(inputs[1].value, 10);
 if (account && !isNaN(amount)) entries.push({ account, amount });
 }
 }
 return entries;
}

function spawnRisingMagic() {
 const totalItems = 28;
 for (let i = 0; i < totalItems; i++) {
 const item = document.createElement("div");
 item.className = "rising-item";
 item.textContent = RISING_EFFECT_SYMBOLS[Math.floor(Math.random() * RISING_EFFECT_SYMBOLS.length)];
 item.style.left = (Math.random() * 92 + 4) + "vw";
 
 const driftX = (Math.random() * 90 - 45) + "px";
 item.style.setProperty("--drift", driftX);

 const size = Math.random() * 16 + 22;
 const duration = Math.random() * 1.5 + 2.0;
 const delay = Math.random() * 0.4;

 item.style.fontSize = size + "px";
 item.style.animationDuration = duration + "s";
 item.style.animationDelay = delay + "s";

 document.body.appendChild(item);
 setTimeout(() => { item.remove(); }, (duration + delay) * 1000);
 }
}

function triggerShake() {
 const container = document.getElementById("mainContainer");
 container.classList.remove("shake-animation");
 void container.offsetWidth;
 container.classList.add("shake-animation");
 setTimeout(() => { container.classList.remove("shake-animation"); }, 500);
}

function checkAnswer() {
 const q = currentQuestions[currentIndex];
 const userDebit = getEntries("debit");
 const userCredit = getEntries("credit");

 const normalize = d => Array.isArray(d) ? d : [d];
 const cDebit = normalize(q.debit);
 const cCredit = normalize(q.credit);

 const matchSide = (u, c) => {
 if (u.length !== c.length) return false;
 const sU = [...u].sort((a,b) => a.account.localeCompare(b.account) || a.amount - b.amount);
 const sC = [...c].sort((a,b) => a.account.localeCompare(b.account) || a.amount - b.amount);
 return sU.every((v, i) => v.account === sC[i].account && v.amount === sC[i].amount);
 };

 const isOk = matchSide(userDebit, cDebit) && matchSide(userCredit, cCredit);
 const res = document.getElementById("result-display");
 res.style.display = "block";

 if (isOk) {
 spawnRisingMagic();
 res.className = "result-box correct";
 res.innerHTML = `<strong>ACCESS GRANTED // 侵入・解析成功</strong><br>${q.explanation}`;
 if (!answeredSet.has(currentIndex)) {
 correctCount++;
 if (isReviewMode) wrongList = wrongList.filter(item => item.story !== q.story);
 answeredSet.add(currentIndex);
 }
 } else {
 triggerShake();
 res.className = "result-box wrong";
 const dStr = cDebit.map(d => `(${d.account}: ${d.amount.toLocaleString()}円)`).join(" ");
 const cStr = cCredit.map(c => `(${c.account}: ${c.amount.toLocaleString()}円)`).join(" ");
 res.innerHTML = `<strong>ACCESS DENIED // 防壁に検知されました</strong><br>正規プロトコル [借方]: ${dStr}<br>正規プロトコル [貸方]: ${cStr}<br><br>【解説】${q.explanation}`;
 if (!answeredSet.has(currentIndex)) {
 if (!wrongList.some(item => item.story === q.story)) wrongList.push(q);
 answeredSet.add(currentIndex);
 }
 }
}

function prevQuestion() { if (currentIndex > 0) loadQuestion(currentIndex - 1); }
function nextQuestion() {
 if (currentIndex < currentQuestions.length - 1) loadQuestion(currentIndex + 1);
 else showClearScreen();
}

function showClearScreen() {
 document.getElementById("quiz-area").style.display = "none";
 const clearArea = document.getElementById("clear-area");
 clearArea.style.display = "block";

 const total = currentQuestions.length;
 const badgeArea = document.getElementById("complete-badge-area");
 const scoreText = document.getElementById("score-text");
 const revArea = document.getElementById("review-btn-area");

 badgeArea.innerHTML = "";
 revArea.innerHTML = "";

 if (wrongList.length === 0) {
 spawnRisingMagic();
 badgeArea.innerHTML = `<div style="display:inline-block; padding:8px 18px; background:rgba(0,255,102,0.15); border:1px solid var(--primary); border-radius:6px; font-weight:bold; color:var(--primary); margin-bottom:14px; font-size:1.1rem; text-shadow:0 0 8px rgba(0,255,102,0.6);">★ OVERCLOCK COMPLETE // 完全制覇 ★</div>`;
 scoreText.innerHTML = `全パケットのハッキングを完璧に完了しました。 (解析成功: ${total} / ${total})`;
 } else {
 scoreText.innerHTML = `セッション終了: ${total} パケット中 ${correctCount} パケット 解析成功。<br>検知・遮断されたログが ${wrongList.length} 件 存在します。`;
 const btn = document.createElement("button");
 btn.className = "btn-review";
 btn.textContent = `TRACE BACK // 遮断されたログを再攻略する (${wrongList.length}問)`;
 btn.onclick = () => {
 isReviewMode = true;
 currentQuestions = [...wrongList];
 currentIndex = 0;
 correctCount = 0;
 answeredSet.clear();
 document.getElementById("quiz-area").style.display = "block";
 clearArea.style.display = "none";
 loadQuestion(0);
 };
 revArea.appendChild(btn);
 }
}

function startFreshStage() {
 loadStage(currentStageIndex);
}

function forceReset() {
 if (confirm("⚠️ システムを工場出荷状態（初期データ）にロールバックしますか？")) {
 localStorage.clear();
 location.reload();
 }
}

function loadCustomData() {
 const input = document.getElementById("json-input").value.trim();
 if (!input) {
 alert("インポートするJSONを入力してください。");
 return;
 }
 try {
 const data = JSON.parse(input);
 if (!Array.isArray(data) || data.length === 0) throw new Error();

 STAGES[currentStageIndex].questions = data;
 localStorage.setItem(`boki_cyber_st${currentStageIndex}_data`, JSON.stringify(data));
 loadStage(currentStageIndex);
 alert(`LEVEL ${currentStageIndex + 1} のパッチ適用に成功しました！（全${data.length}問）`);
 } catch (e) {
 alert("⚠️ JSONパッチのパースに失敗しました。構文を確認してください。");
 }
}

window.addEventListener("DOMContentLoaded", init);
</script>
